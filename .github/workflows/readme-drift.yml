name: README drift check

on:
  push:
    paths:
      - README.md
      - wiki/index.md
      - scripts/sync-readme.py
  pull_request:
    paths:
      - README.md
      - wiki/index.md
      - scripts/sync-readme.py

jobs:
  check-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check README drift
        run: python3 scripts/sync-readme.py --check
